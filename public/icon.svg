<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="featherEye" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.35"/>

  <!-- Sacred Radiant Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="8 6" opacity="0.4"/>
  <circle cx="256" cy="256" r="172" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.55"/>

  <!-- Official App Logo: Sacred Kurukshetra Chariot (दिव्य रथ - Sri Krishna & Arjuna) -->
  <g transform="translate(256, 235)" filter="url(#glow)">
    
    <!-- Aura Sunburst / Dharma Halo behind Chariot -->
    <circle cx="0" cy="-10" r="140" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.25" stroke-dasharray="6 6"/>
    <circle cx="0" cy="-10" r="110" fill="url(#goldGrad)" opacity="0.08"/>

    <!-- Sacred Dhwaja (Kapidhwaja Flagstaff) with fluttering Banner -->
    <line x1="-60" y1="40" x2="-60" y2="-130" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round"/>
    <circle cx="-60" cy="-135" r="7" fill="#fef08a" stroke="#f59e0b" stroke-width="2"/>
    <!-- Fluttering Golden Banner -->
    <path d="M -60 -130 C -15 -115 10 -90 -10 -70 C -30 -50 -55 -60 -60 -55 Z" 
          fill="url(#goldGrad)" stroke="#fef08a" stroke-width="2"/>
    <text x="-40" y="-85" font-family="serif" font-size="16" font-weight="bold" fill="#451a03" text-anchor="middle">ॐ</text>

    <!-- Chariot Royal Canopy Dome -->
    <path d="M -95 40 C -95 -20 -30 -50 40 -30 C 70 -20 85 10 75 40 Z" 
          fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linejoin="round"/>
    <path d="M -80 35 C -80 -5 -30 -30 30 -15 C 55 -5 65 15 60 35 Z" 
          fill="url(#goldGrad)" opacity="0.15"/>

    <!-- Sri Krishna as Divine Charioteer (पार्थसारथी) with Peacock Feather -->
    <!-- Dusk Blue Silhouette & Golden Silk -->
    <path d="M 25 35 Q 32 0 42 35 Z" fill="#0284c7" stroke="url(#goldGrad)" stroke-width="2"/>
    <circle cx="33" cy="-5" r="14" fill="#38bdf8" stroke="#0284c7" stroke-width="2"/>
    <!-- Peacock Feather Plume on Krishna -->
    <path d="M 33 -19 Q 45 -42 55 -32 Q 45 -22 35 -16 Z" fill="#10b981" stroke="#fef08a" stroke-width="1.5"/>
    <circle cx="45" cy="-28" r="3.5" fill="#0284c7"/>

    <!-- Arjuna seated in reverence with Bow (गाण्डीव) -->
    <path d="M -30 40 Q -20 15 -10 40 Z" fill="#b45309" stroke="url(#goldGrad)" stroke-width="2"/>
    <circle cx="-20" cy="10" r="12" fill="#fbbf24" stroke="#d97706" stroke-width="2"/>
    <!-- Hands in Anjali mudra / Reverence -->
    <path d="M -8 24 Q 2 20 -2 34" stroke="#fef08a" stroke-width="3" stroke-linecap="round"/>

    <!-- Chariot Body Carriage Frame -->
    <path d="M -105 45 L 85 45 L 75 -5 L -85 -5 Z" 
          fill="#1c1917" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linejoin="round"/>
    <rect x="-95" y="10" width="165" height="24" rx="6" fill="url(#goldGrad)" opacity="0.25"/>

    <!-- Golden Reins stretching forward to divine steeds -->
    <path d="M 42 20 Q 90 25 150 45" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="4 2"/>
    <path d="M 42 26 Q 95 32 155 52" stroke="url(#goldGrad)" stroke-width="2.5" stroke-dasharray="4 2"/>

    <!-- Front Yoke / Shaft -->
    <line x1="85" y1="45" x2="160" y2="45" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round"/>

    <!-- Sacred 12-Spoked Dharma Chariot Wheel (रथ चक्र) -->
    <g transform="translate(-10, 75)">
      <!-- Outer Rim with concentric sacred border -->
      <circle cx="0" cy="0" r="54" fill="#18181b" stroke="url(#goldGrad)" stroke-width="6"/>
      <circle cx="0" cy="0" r="46" fill="none" stroke="#fef08a" stroke-width="2" opacity="0.8"/>
      <circle cx="0" cy="0" r="18" fill="url(#goldGrad)" stroke="#fef08a" stroke-width="2"/>
      <circle cx="0" cy="0" r="7" fill="#451a03"/>
      
      <!-- 12 Radiating Golden Spokes of Dharma Wheel -->
      <line x1="0" y1="-46" x2="0" y2="46" stroke="url(#goldGrad)" stroke-width="3"/>
      <line x1="-46" y1="0" x2="46" y2="0" stroke="url(#goldGrad)" stroke-width="3"/>
      <line x1="-32" y1="-32" x2="32" y2="32" stroke="url(#goldGrad)" stroke-width="3"/>
      <line x1="-32" y1="32" x2="32" y2="-32" stroke="url(#goldGrad)" stroke-width="3"/>
      <line x1="-16" y1="-43" x2="16" y2="43" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.85"/>
      <line x1="-43" y1="-16" x2="43" y2="16" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.85"/>
      <line x1="-16" y1="43" x2="16" y2="-43" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.85"/>
      <line x1="-43" y1="16" x2="43" y2="-16" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.85"/>
    </g>

  </g>

  <!-- Typography subtitled at bottom: "GEETAFLOW" -->
  <text x="256" y="445" text-anchor="middle" font-family="'Cinzel', serif" font-weight="700" font-size="34" letter-spacing="9" fill="url(#goldGrad)">GEETAFLOW</text>
  <text x="256" y="475" text-anchor="middle" font-family="'Yantramanav', sans-serif" font-weight="500" font-size="16" letter-spacing="4" fill="#a1a1aa">श्रीमद्भगवद्गीता</text>
</svg>
