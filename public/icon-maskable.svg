<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="maskBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#040711"/>
    </linearGradient>
    <linearGradient id="maskGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <radialGradient id="maskCenterGlow" cx="50%" cy="46%" r="48%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="0"/>
    </radialGradient>
    <filter id="maskGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full-bleed background for maskable adaptive clipping (no rounded corners so OS can crop cleanly) -->
  <rect width="512" height="512" fill="url(#maskBgGrad)"/>
  <rect width="512" height="512" fill="url(#maskCenterGlow)"/>

  <!-- Safe-zone scaled Chariot (strictly within 80% circle radius 204px from center 256,256) -->
  <g transform="translate(256, 230) scale(0.88)">
    
    <!-- Dharma Halo Ring -->
    <circle cx="0" cy="0" r="185" fill="none" stroke="url(#maskGoldGrad)" stroke-width="2" stroke-dasharray="6 5" opacity="0.35"/>
    <circle cx="0" cy="0" r="168" fill="none" stroke="url(#maskGoldGrad)" stroke-width="1.2" opacity="0.5"/>

    <!-- Chariot Group -->
    <g transform="translate(0, -20)" filter="url(#maskGlow)">
      
      <!-- Flagstaff (Kapidhwaja) -->
      <line x1="-55" y1="40" x2="-55" y2="-120" stroke="url(#maskGoldGrad)" stroke-width="5.5" stroke-linecap="round"/>
      <circle cx="-55" cy="-125" r="6.5" fill="#fef08a" stroke="#f59e0b" stroke-width="2"/>
      <!-- Golden Banner -->
      <path d="M -55 -120 C -15 -105 8 -82 -10 -64 C -28 -46 -50 -54 -55 -50 Z" 
            fill="url(#maskGoldGrad)" stroke="#fef08a" stroke-width="1.8"/>
      <text x="-37" y="-77" font-family="serif" font-size="15" font-weight="bold" fill="#451a03" text-anchor="middle">ॐ</text>

      <!-- Chariot Canopy Dome -->
      <path d="M -90 40 C -90 -16 -28 -46 36 -28 C 65 -18 78 10 70 40 Z" 
            fill="none" stroke="url(#maskGoldGrad)" stroke-width="4.5" stroke-linejoin="round"/>
      <path d="M -75 35 C -75 -2 -28 -26 28 -12 C 52 -3 60 15 55 35 Z" 
            fill="url(#maskGoldGrad)" opacity="0.16"/>

      <!-- Sri Krishna with Peacock Feather -->
      <path d="M 22 35 Q 29 2 39 35 Z" fill="#0284c7" stroke="url(#maskGoldGrad)" stroke-width="1.8"/>
      <circle cx="30" cy="-2" r="13" fill="#38bdf8" stroke="#0284c7" stroke-width="1.8"/>
      <path d="M 30 -15 Q 41 -36 50 -27 Q 41 -18 32 -12 Z" fill="#10b981" stroke="#fef08a" stroke-width="1.4"/>
      <circle cx="41" cy="-23" r="3" fill="#0284c7"/>

      <!-- Arjuna seated in reverence with Bow -->
      <path d="M -28 40 Q -18 16 -8 40 Z" fill="#b45309" stroke="url(#maskGoldGrad)" stroke-width="1.8"/>
      <circle cx="-18" cy="12" r="11" fill="#fbbf24" stroke="#d97706" stroke-width="1.8"/>
      <path d="M -7 24 Q 2 20 -1 33" stroke="#fef08a" stroke-width="2.6" stroke-linecap="round"/>

      <!-- Chariot Body Carriage Frame -->
      <path d="M -98 45 L 80 45 L 70 -2 L -80 -2 Z" 
            fill="#1c1917" stroke="url(#maskGoldGrad)" stroke-width="4" stroke-linejoin="round"/>
      <rect x="-88" y="12" width="155" height="22" rx="5" fill="url(#maskGoldGrad)" opacity="0.25"/>

      <!-- Golden Reins -->
      <path d="M 39 20 Q 85 24 140 43" stroke="url(#maskGoldGrad)" stroke-width="2.6" stroke-dasharray="4 2"/>
      <path d="M 39 25 Q 90 31 145 50" stroke="url(#maskGoldGrad)" stroke-width="2.2" stroke-dasharray="4 2"/>

      <!-- Front Shaft -->
      <line x1="80" y1="45" x2="150" y2="45" stroke="url(#maskGoldGrad)" stroke-width="4.5" stroke-linecap="round"/>

      <!-- Sacred 12-Spoked Dharma Chariot Wheel -->
      <g transform="translate(-10, 72)">
        <circle cx="0" cy="0" r="50" fill="#18181b" stroke="url(#maskGoldGrad)" stroke-width="5.5"/>
        <circle cx="0" cy="0" r="42" fill="none" stroke="#fef08a" stroke-width="1.8" opacity="0.85"/>
        <circle cx="0" cy="0" r="16" fill="url(#maskGoldGrad)" stroke="#fef08a" stroke-width="1.8"/>
        <circle cx="0" cy="0" r="6" fill="#451a03"/>
        
        <line x1="0" y1="-42" x2="0" y2="42" stroke="url(#maskGoldGrad)" stroke-width="2.8"/>
        <line x1="-42" y1="0" x2="42" y2="0" stroke="url(#maskGoldGrad)" stroke-width="2.8"/>
        <line x1="-30" y1="-30" x2="30" y2="30" stroke="url(#maskGoldGrad)" stroke-width="2.8"/>
        <line x1="-30" y1="30" x2="30" y2="-30" stroke="url(#maskGoldGrad)" stroke-width="2.8"/>
        <line x1="-15" y1="-39" x2="15" y2="39" stroke="url(#maskGoldGrad)" stroke-width="2.2" opacity="0.85"/>
        <line x1="-39" y1="-15" x2="39" y2="15" stroke="url(#maskGoldGrad)" stroke-width="2.2" opacity="0.85"/>
        <line x1="-15" y1="39" x2="15" y2="-39" stroke="url(#maskGoldGrad)" stroke-width="2.2" opacity="0.85"/>
        <line x1="-39" y1="15" x2="39" y2="-15" stroke="url(#maskGoldGrad)" stroke-width="2.2" opacity="0.85"/>
      </g>

    </g>

    <!-- Typography centered within the 80% safe zone -->
    <text x="0" y="172" text-anchor="middle" font-family="'Cinzel', serif" font-weight="700" font-size="30" letter-spacing="8" fill="url(#maskGoldGrad)">GEETAFLOW</text>
    <text x="0" y="196" text-anchor="middle" font-family="'Yantramanav', sans-serif" font-weight="500" font-size="14" letter-spacing="3.5" fill="#d4d4d8">श्रीमद्भगवद्गीता</text>
  </g>
</svg>
