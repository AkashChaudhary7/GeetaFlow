name: Build & Sign Android App Bundle (AAB)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-aab:
    name: Build & Sign Release AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm install --no-audit --no-fund

      - name: Build Web Assets
        run: npm run build

      - name: Sync to Android Platform
        run: npx cap sync android

      - name: Set up Gradle Executable Permission
        run: chmod +x android/gradlew

      - name: Build Android App Bundle (.aab)
        run: |
          cd android
          ./gradlew bundleRelease --no-daemon

      - name: Prepare Signing Keystore
        id: prepare_keystore
        run: |
          mkdir -p android/app/keystore
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "Using custom keystore from GitHub Secrets..."
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/keystore/release.keystore
            echo "KEYSTORE_PASS=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASS=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            echo "No GitHub Secret found. Auto-generating a fresh release keystore..."
            keytool -genkey -v \
              -keystore android/app/keystore/release.keystore \
              -alias geetaflow \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "GeetaFlow@2026" \
              -keypass "GeetaFlow@2026" \
              -dname "CN=GeetaFlow, OU=Mobile, O=GeetaFlow, L=Delhi, S=Delhi, C=IN"
            echo "KEYSTORE_PASS=GeetaFlow@2026" >> $GITHUB_ENV
            echo "KEY_ALIAS=geetaflow" >> $GITHUB_ENV
            echo "KEY_PASS=GeetaFlow@2026" >> $GITHUB_ENV
          fi

      - name: Sign Android Release AAB with jarsigner
        run: |
          AAB_FILE=$(ls android/app/build/outputs/bundle/release/*.aab | head -n 1)
          echo "Signing $AAB_FILE..."
          jarsigner -verbose \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -keystore android/app/keystore/release.keystore \
            -storepass "$KEYSTORE_PASS" \
            -keypass "$KEY_PASS" \
            "$AAB_FILE" "$KEY_ALIAS"
          
          # Verify signature
          jarsigner -verify -verbose -certs "$AAB_FILE"

      - name: Upload Signed AAB and Keystore Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: geetaflow-signed-aab-and-keystore
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/keystore/release.keystore
          retention-days: 30

